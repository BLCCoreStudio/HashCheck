name: RepoDoctor

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-health:
    name: RepoDoctor CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run RepoDoctor
        uses: BLCCoreStudio/RepoDoctor@v0.1.2
        with:
          path: .
          format: terminal
          language: en
